<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <title>나의 할 일</title>
</head>
<body>
    <header id="mobile-header">
        <button id="hamburger">☰</button>
        <h3>할 일</h3>
    </header>

        
        <div id="app">
        <aside id="sidebar">
            <h2>일정</h2>
            <nav>
                <ul>

                <span>제목</span>
                <span>Due date</span>
                <span>Priority</span>
                <span>Do date</span>    <!--Do date: 날짜-->
                <span></span>   <!--Do date: 시간-->
            </div>

                <input type="checkbox">
                <div class="task-info">
                    <span class="task-title">제목</span>
                    <span class="task-sub">과목</span>
                </div>
                <span class="T_Due_Date">OOO 00</span>   <!--Due date-->
                <span class="T_Priorit T_p1">(상태)</span>   <!--T_Priority-->
