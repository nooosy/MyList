<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>나의 할 일</title>
</head>
<body>

    <header id="mobile-header">
        <button id="hamburger">☰</button>
        <h3>할 일</h3>
    </header>

    <div id="app">

        <aside id="sidebar">
            <h2>일정</h2>
            <nav>
                <ul>
                    <li>오늘의 일정</li>
                </ul>
            </nav>
            <h2>갤럭시</h2>
            <nav>
                <ul>
                    <li>할 일</li>
                    <li>나의 공부</li>
                </ul>
            </nav>
        </aside>

        <main id="content">

            <!-- 수행평가 목록 -->
            <div class="list-header">
                <h2>수행평가</h2>
                <button class="filter-btn">≡</button>
            </div>
            <div class="column-header">
                <span>제목</span>
                <span>Due date</span>
                <span>Priority</span>
                <span>Do date</span>
                <span>Do time</span>
            </div>
            <div class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <span class="task-title">제목</span>
                    <span class="task-sub">과목</span>
                </div>
                <span class="T_Due_Date">OOO 00</span>
                <span class="T_Priority T_p1">(상태)</span>
                <span class="T_Do_Date">OOO 00</span>
                <span class="T_Do_Time">OOOO</span>
            </div>

            <!-- 할 과제 목록 -->
            <div class="list-header">
                <h2>할 과제</h2>
                <button class="filter-btn">≡</button>
            </div>
            <div class="column-header">
                <span>제목</span>
                <span>Due date</span>
                <span>Priority</span>
                <span>Do date</span>
                <span>Do time</span>
            </div>
            <div class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <span class="task-title">제목</span>
                    <span class="task-sub">과목</span>
                </div>
                <span class="T_Due_Date">OOO 00</span>
                <span class="T_Priority T_p1">(상태)</span>
                <span class="T_Do_Date">OOO 00</span>
                <span class="T_Do_Time">OOOO</span>
            </div>

            <!-- 할 일 목록 -->
            <div class="list-header">
                <h2>할 일</h2>
                <button class="filter-btn">≡</button>
            </div>
            <div class="column-header">
                <span>제목</span>
                <span>Due date</span>
                <span>Priority</span>
                <span>Do date</span>
                <span>Do time</span>
            </div>
            <div class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <span class="task-title">제목</span>
                    <span class="task-sub">과목</span>
                </div>
                <span class="T_Due_Date">OOO 00</span>
                <span class="T_Priority T_p1">(상태)</span>
                <span class="T_Do_Date">OOO 00</span>
                <span class="T_Do_Time">OOOO</span>
            </div>

        </main>

    </div>

</body>
</html>
