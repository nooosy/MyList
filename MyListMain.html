<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>나의 할 일</title>
</head>
<body>

    <header id="mobile-header">
        <button id="hamburger">☰</button>
        <h3>할 일</h3>
    </header>

    <div id="app">

        <!-- 사이드바 -->
        <div id="overlay"></div>

        <aside id="sidebar">
            <h2>일정</h2>
            <nav>
                <ul>
                    <li>오늘의 일정</li>
                </ul>
            </nav>
            <h2>갤럭시</h2>
            <nav>
                <ul>
                    <li>할 일</li>
                    <li>나의 공부</li>
                </ul>
            </nav>
        </aside>




        <main id="content">

            <div class="hidden_height_box"> </div>

            <!-- 수행평가 목록 -->
            <div class="list-header">
                <h2 class="listname">수행평가</h2>
                <button class="filter-btn">⁝</button>
            </div>

            <div class="table-row header-row">
                <div class="col-fixed tititle">제목</div>
                <div class="scroll-area">
                    <span class="col">Due date</span>
                    <span class="col">Priority</span>
                    <span class="col">Do date</span>
                    <span class="col">Do time</span>
                </div>
            </div>

            <div class="table-row">
                <div class="col-fixed">
                    <div class="status-btn">
                        <img src="./Asset/status/sta0.png" class="status-icon">
                    </div>
                    <div class="task-info">
                        <span class="task-title">제목</span>
                        <span class="task-sub">과목</span>
                    </div>
                </div>
                <div class="scroll-area">
                    <span class="col">OOO 00</span>
                    <span class="col">
                        <span class="tagg T_p1">긴급</span>
                    </span>
                    <span class="col">OOO 00</span>
                    <span class="col">
                        <span class="tagg">아침</span>
                    </span>
                </div>
            </div>

            <div class="hidden_height_box"> </div>

            <!-- 할 일 목록 -->
            <div class="list-header">
                <h2 class="listname">할 일</h2>
                <button class="filter-btn">⁝</button>
            </div>

            <div class="table-row header-row">
                <div class="col-fixed tititle">제목</div>
                <div class="scroll-area">
                    <span class="col">Due date</span>
                    <span class="col">Priority</span>
                    <span class="col">Do date</span>
                    <span class="col">Do time</span>
                </div>
            </div>

            <div class="table-row">
                <div class="col-fixed">
                    <div class="status-btn">
                        <img src="./Asset/status/sta0.png" class="status-icon">
                    </div>
                    <div class="task-info">
                        <span class="task-title">제목</span>
                        <span class="task-sub">과목</span>
                    </div>
                </div>
                <div class="scroll-area">
                    <span class="col">OOO 00</span>
                    <span class="col">
                        <span class="tagg T_p1">긴급</span>
                    </span>
                    <span class="col">OOO 00</span>
                    <span class="col">
                        <span class="tagg">아침</span>
                    </span>
                </div>
            </div>

            <div class="hidden_height_box"> </div>

            <!-- 할 일 과제 -->
            <div class="list-header">
                <h2>할 과제</h2>
                <button class="filter-btn">⁝</button>
            </div>

            <div class="table-row header-row">
                <div class="col-fixed tititle">제목</div>
                <div class="scroll-area">
                    <span class="col">Due date</span>
                    <span class="col">Priority</span>
                    <span class="col">Do date</span>
                    <span class="col">Do time</span>
                </div>
            </div>

            <div class="table-row">
                <div class="col-fixed">
                    <div class="status-btn">
                        <img src="./Asset/status/sta0.png" class="status-icon">
                    </div>
                    <div class="task-info">
                        <span class="task-title">제목</span>
                        <span class="task-sub">과목</span>
                    </div>
                </div>
                <div class="scroll-area">
                    <span class="col">OOO 00</span>
                    <span class="col">
                        <span class="tagg T_p1">긴급</span>
                    </span>
                    <span class="col">OOO 00</span>
                    <span class="col">
                        <span class="tagg">아침</span>
                    </span>
                </div>
            </div>
            <div class="hidden_height_box"> </div>
        </main>
    </div>

    <nav id="tab-bar">
        <button class="tab-item">
            <img src=".\Asset\icons\free-icon-font-ballot-7653160.png" alt="list">
            <span>List</span>
        </button>

        <button class="tab-item">
            <img src=".\Asset\icons\free-icon-font-square-star-10294913.png" alt="priority">
            <span>Priority
            </span>
        </button>

        <button class="tab-item">
            <img src=".\Asset\icons\free-icon-font-calendar-minus-7602626.png" alt="do-date">
            <span>Due Date</span>
        </button>

        <button class="tab-item">
            <img src=".\Asset\icons\free-icon-font-calendar-clock-7602606.png" alt="due-date">
            <span>Do date</span>
        </button>
    </nav>


<script src="main.js"></script>
</body>
</html>
